version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose     # unclosed HTTP response bodies
    - sqlclosecheck # unclosed sql.Rows and sql.Stmt
    - rowserrcheck  # rows.Err not checked after iteration
    - nilerr        # returning nil after checking err != nil
    - errorlint     # == or type assertions on errors that may be wrapped
    - wastedassign  # assignments never read
    - gocritic      # default checks: suspicious conditions, argument order, append misuse
    - modernize     # newer language and library forms (min, slices, new(expr), t.Context)
    - usetesting    # t.TempDir, t.Setenv, t.Context in tests
    - thelper       # test helpers call t.Helper first
    - nolintlint    # every //nolint names its linter and says why
  settings:
    errcheck:
      # Errors with nothing to act on: closing the read side of a stream,
      # SQL cleanup reported through Commit or rows.Err, writes to a client
      # or terminal, and the store's deferred Close, which is idempotent and
      # checked where it matters (serve).
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - io.WriteString
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*github.com/legibet/verbatim/internal/store.Store).Close
    staticcheck:
      # staticcheck's defaults, minus the De Morgan rewrite suggestion.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001"]
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Test setup failures surface as test failures.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
