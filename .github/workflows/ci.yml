name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The binary embeds internal/ui/dist, so it must be the build of web/.
      - name: Check that internal/ui/dist is up to date
        run: |
          changes=$(git status --porcelain --untracked-files=all -- ../internal/ui/dist)
          if [ -n "$changes" ]; then
            echo "::error::internal/ui/dist differs from a fresh build of web/; run 'cd web && pnpm build' and commit it"
            echo "$changes"
            exit 1
          fi
